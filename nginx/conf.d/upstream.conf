# Blue-Green 스위칭: 배포 시 active를 blue ↔ green 전환
# 전환 후: docker exec travel-nginx nginx -s reload

upstream backend {
    server travel-backend-blue:8080;
    # server travel-backend-green:8080;  # 배포 시 이쪽으로 전환
}

server {
    listen 80;

    # 헬스체크
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # API 프록시
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 지원
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}
