name: Deploy Backend to Home Server

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.home.yml'
      - 'nginx/**'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}

      - name: Build with Gradle
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: Deploy with Docker Compose
        run: |
          docker compose -f docker-compose.home.yml build backend-blue
          docker compose -f docker-compose.home.yml up -d --no-deps blue

          # 헬스체크 대기 (최대 60초)
          echo "Waiting for backend to be healthy..."
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8080/hc > /dev/null 2>&1; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i/12 - waiting 5s..."
            sleep 5
          done
          echo "Backend health check failed!"
          exit 1
