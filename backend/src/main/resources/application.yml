server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:25}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jwt:
    secret: ${JWT_SECRET}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-not-configured}
            scope: profile, email
          naver:
            client-id: ${NAVER_CLIENT_ID:placeholder-not-configured}
            client-secret: ${NAVER_CLIENT_SECRET:placeholder-not-configured}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope: name, email, profile_image
            client-name: Naver
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  access-token:
    expiration: ${JWT_ACCESS_EXPIRATION:600000}
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:86400000}
  refresh-cookie:
    max-age: ${JWT_REFRESH_COOKIE_MAX_AGE:86400}

cookie:
  secure: ${COOKIE_SECURE:true}

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

mail:
  from:
    email: ${MAIL_FROM_EMAIL:noreply@whynottravel.xyz}

aws:
  s3:
    enabled: ${AWS_S3_ENABLED:false}

minio:
  enabled: ${MINIO_ENABLED:false}

app:
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
