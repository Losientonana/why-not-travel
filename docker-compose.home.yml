version: '3.8'

# ========================================
# 홈서버 환경 (백엔드 전용)
# 프론트엔드는 Vercel에서 운영
# Cloudflare Tunnel → Nginx → Spring Boot
# ========================================

networks:
  travel-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local

services:
  # ======================================
  # Nginx (리버스 프록시 + Blue-Green 스위칭)
  # ======================================
  nginx:
    image: nginx:1.25-alpine
    container_name: travel-nginx
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.home.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - travel-network
    depends_on:
      - blue

  # ======================================
  # MySQL
  # ======================================
  mysql-db:
    image: mysql:8.0.35
    container_name: travel-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - travel-network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=100
      - --innodb_buffer_pool_size=256M
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ======================================
  # Redis
  # ======================================
  redis-cache:
    image: redis:7.2-alpine
    container_name: travel-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - travel-network
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================================
  # MinIO (S3 호환 오브젝트 스토리지)
  # ======================================
  minio:
    image: minio/minio:latest
    container_name: travel-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - travel-network
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================================
  # Spring Boot - BLUE (기본 활성)
  # ======================================
  blue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel-backend-blue
    restart: always
    expose:
      - "8080"
    env_file:
      - .env.home
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - travel-network
    deploy:
      resources:
        limits:
          memory: 1G

  # ======================================
  # Spring Boot - GREEN (배포 시 사용)
  # ======================================
  green:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel-backend-green
    restart: "no"
    profiles:
      - deploy
    expose:
      - "8080"
    env_file:
      - .env.home
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - travel-network
    deploy:
      resources:
        limits:
          memory: 1G
